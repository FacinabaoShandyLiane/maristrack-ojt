<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarisTrack | Settings</title>

  <link rel="stylesheet" href="MT_settings.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkCyan: {
              50: '#f1f9f9', 100: '#daefef', 200: '#b9dfdf', 300: '#8bc6c6',
              400: '#56a3a3', 500: '#3a8787', 600: '#2d6d6d', 700: '#285959',
              800: '#254a4a', 900: '#223f3f', 950: '#0f2424',
            },
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
</head>

<body data-page="settings" class="bg-slate-50 text-slate-900 font-sans h-screen flex overflow-hidden">

  <!-- ✅ MODERN SIDEBAR (SAME AS DASHBOARD/ATTENDANCE/REPORTS) -->
  <aside id="sidebar" class="sidebar expanded">
    <!-- Header / Logo -->
    <div class="flex items-center h-20 px-5 mb-8 relative">
      <div class="logo-container flex items-center">
        <div class="w-9 h-9 bg-teal-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-teal-500/30 mr-3 shrink-0">
          <span class="font-bold text-xl">M</span>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-white whitespace-nowrap">
          Maris<span class="text-teal-400">Track</span>
        </h1>
      </div>

      <!-- Chevron Toggle -->
      <button id="btnToggleSidebar" type="button" class="chevron-btn">
        <i class="fa-solid fa-chevron-right text-xl"></i>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 relative">
      <div id="indicator" class="sliding-indicator"></div>

      <ul class="space-y-[14px] pl-3 relative z-10" id="navList">
        <li class="relative">
          <button class="nav-item" data-index="0" data-route="dashboard" type="button">
            <div class="min-w-[54px] flex items-center justify-center text-xl">
              <i class="fa-solid fa-gauge-high"></i>
            </div>
            <span class="nav-text">Dashboard</span>
          </button>
        </li>

        <li class="relative">
          <button class="nav-item" data-index="1" data-route="attendance" type="button">
            <div class="min-w-[54px] flex items-center justify-center text-xl">
              <i class="fa-solid fa-calendar-check"></i>
            </div>
            <span class="nav-text">Attendance</span>
          </button>
        </li>

        <li class="relative">
          <button class="nav-item" data-index="2" data-route="reports" type="button">
            <div class="min-w-[54px] flex items-center justify-center text-xl">
              <i class="fa-solid fa-chart-column"></i>
            </div>
            <span class="nav-text">Reports</span>
          </button>
        </li>

        <li class="relative">
          <!-- ✅ active on Settings page -->
          <button class="nav-item active" data-index="3" data-route="settings" type="button">
            <div class="min-w-[54px] flex items-center justify-center text-xl">
              <i class="fa-solid fa-gear"></i>
            </div>
            <span class="nav-text">Settings</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Footer -->
    <div class="p-3 mt-auto mb-6">
      <div class="flex flex-col items-start space-y-4">
        <div class="flex items-center w-full px-2">
          <div class="min-w-[40px] flex items-center justify-center text-teal-500/80 text-3xl">
            <i class="fa-solid fa-circle-user"></i>
          </div>

          <!-- ✅ Dynamic name + label -->
          <div class="ml-3 overflow-hidden nav-text">
            <p id="sb-role-name" class="text-sm font-bold text-white truncate leading-tight">—</p>
            <p id="sb-role-label" class="text-[11px] text-slate-500 font-medium tracking-wide">Super Admin</p>
          </div>
        </div>

        <!-- Logout -->
        <button type="button"
                onclick="confirmLogout()"
                class="flex items-center w-full px-2 py-2 text-slate-400 hover:text-red-400 transition-all duration-300 group">
          <div class="min-w-[40px] flex items-center justify-center text-xl">
            <i class="fa-solid fa-right-from-bracket"></i>
          </div>
          <span class="ml-3 font-semibold text-sm nav-text">Logout</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-grow flex flex-col h-screen overflow-hidden">

    <!-- HEADER -->
    <header class="h-20 fancy-header px-8 flex items-center justify-between shrink-0 sticky top-0 z-40">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-bold text-darkCyan-900">Settings</h1>
      </div>
<div class="flex items-center gap-6">
        <div class="flex flex-col text-right">
          <span id="header-clock" class="text-sm font-bold text-slate-700">--:--</span>
          <span id="header-date" class="text-[10px] text-slate-400 font-medium">---</span>
        </div>
      
    </header>

    <!-- CONTENT -->
    <div class="p-4 sm:p-6 overflow-y-auto custom-scrollbar flex-grow flex justify-center">
      <div class="w-full max-w-4xl space-y-6">

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
          <div class="p-8 space-y-8">

            <!-- User Info -->
            <div>
              <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">User Information</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

               <div class="space-y-2">
  <label class="text-[10px] font-bold text-slate-400">Full Name</label>

  <!-- ✅ clickable wrapper -->
  <button type="button" id="btn-edit-profile"
    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-600
           flex items-center justify-between hover:bg-slate-100 transition cursor-pointer">

    <span id="ui-fullname">—</span>

    <!-- ✅ edit icon instead of lock -->
    <i class="fa-solid fa-pen-to-square text-[12px] text-slate-400"></i>
  </button>
</div>

                <div class="space-y-2">
  <label class="text-[10px] font-bold text-slate-400">User ID</label>

  <button type="button" id="btn-edit-profile-2"
    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-600
           flex items-center justify-between hover:bg-slate-100 transition cursor-pointer">

    <span id="ui-userid">—</span>
    <i class="fa-solid fa-pen-to-square text-[12px] text-slate-400"></i>
  </button>
</div>

              </div>
            </div>

            <!-- Email -->
            <div class="border-t border-slate-100 pt-8">
              <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Email Settings</h3>

              <div class="flex flex-wrap gap-4">
                <div class="flex-grow max-w-md space-y-2">
                  <label class="text-[10px] font-bold text-slate-400">Contact Email</label>
                  <div class="flex gap-2">
                    <input id="settings-email" type="email" placeholder="adminmaristrack@university.edu"
                           class="flex-grow px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-1 focus:ring-darkCyan-500">

                    <button id="btn-send-code" onclick="sendVerifyCode()"
                            class="px-6 py-3 bg-darkCyan-600 text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-darkCyan-700 transition-all">
                      Send
                    </button>
                  </div>

                  <!-- ✅ Dynamic hint -->
                  <p id="email-hint" class="text-[10px] font-bold text-slate-400 mt-2"></p>
                </div>

                <div class="flex-grow max-w-xs space-y-2">
                  <label class="text-[10px] font-bold text-slate-400">Verification Box</label>
                  <div class="flex gap-2">
                    <input id="verify-code-input" type="text" placeholder="Enter Code"
                           class="flex-grow px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-1 focus:ring-darkCyan-500 text-center tracking-widest">

                    <button id="btn-verify-code" onclick="verifyCode()"
                            class="px-6 py-3 bg-darkCyan-950 text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-black transition-all">
                      Verify
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Security -->
            <div class="border-t border-slate-100 pt-8">
              <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Security</h3>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="space-y-2">
                  <label class="text-[10px] font-bold text-slate-400">Current Password</label>
                  <div class="relative">
                    <input id="pw-current" type="password" placeholder="••••••••"
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-1 focus:ring-darkCyan-500 pr-11">
                    <button type="button" onclick="togglePw('pw-current', this)"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-darkCyan-700">
                      <i class="fa-solid fa-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="space-y-2">
                  <label class="text-[10px] font-bold text-slate-400">New Password</label>
                  <div class="relative">
                    <input id="pw-new" type="password" placeholder="At least 8 characters"
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-1 focus:ring-darkCyan-500 pr-11">
                    <button type="button" onclick="togglePw('pw-new', this)"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-darkCyan-700">
                      <i class="fa-solid fa-eye"></i>
                    </button>
                  </div>
                  <p class="text-[10px] text-slate-400 font-semibold">Use letters + numbers for stronger password.</p>
                </div>

                <div class="space-y-2">
                  <label class="text-[10px] font-bold text-slate-400">Confirm New Password</label>
                  <div class="relative">
                    <input id="pw-confirm" type="password" placeholder="Re-type new password"
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-1 focus:ring-darkCyan-500 pr-11">
                    <button type="button" onclick="togglePw('pw-confirm', this)"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-darkCyan-700">
                      <i class="fa-solid fa-eye"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-3 mt-5">
                <button id="btn-update-password" onclick="handleChangePassword()"
                        class="px-6 py-3 bg-darkCyan-600 text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-darkCyan-700 transition-all shadow-lg shadow-darkCyan-200">
                  Update Password
                </button>

                <button id="btn-clear-password" onclick="clearPasswordFields()"
                        class="px-6 py-3 bg-slate-100 text-slate-600 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-slate-200 transition-all">
                  Clear
                </button>

                <p id="pw-hint" class="text-[10px] font-bold text-slate-400"></p>
              </div>
            </div>
            <!-- end security -->

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- MODAL -->
  <div id="modal-overlay"
       class="modal-bg fixed inset-0 z-[100] bg-darkCyan-950/60 hidden flex items-center justify-center p-4">
    <div id="modal-container"
         class="bg-white w-full max-w-lg rounded-3xl shadow-2xl transform transition-all scale-95 opacity-0 duration-200 overflow-hidden"></div>
  </div>

  <!-- Logout Modal (modern) -->
<div id="logoutModal"
     class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm modal-overlay">
  <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl modal-content border border-slate-100 relative">
    
    <button id="btnCloseModal" type="button"
            class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 transition-colors">
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>

    <div class="flex flex-col items-center text-center">

      <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center text-red-500 mb-6 text-3xl">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>

      <h3 class="text-xl font-bold text-slate-900 mb-2">Confirm Logout</h3>

      <p class="text-slate-500 mb-8 px-4 font-medium">
        Are you sure you want to log out of MarisTrack? You'll need to sign in again to access your tracks.
      </p>

      <div class="flex gap-3 w-full">
        <button id="btnCancelLogout" type="button"
                class="flex-1 py-4 px-6 rounded-2xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 transition-all">
          Cancel
        </button>

        <button id="btnConfirmLogout" type="button"
                class="flex-1 py-4 px-6 rounded-2xl bg-teal-500 text-white font-bold shadow-lg shadow-teal-500/30 hover:bg-teal-600 hover:-translate-y-0.5 transition-all">
          Logout
        </button>
      </div>

    </div>
  </div>
</div>

  <script src="MT_settings.js"></script>

</body>
</html>
